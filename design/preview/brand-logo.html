<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 0; background: var(--bg-cream); display: flex; }
  .light, .dark { flex: 1; display: flex; align-items: center; justify-content: center; padding: 36px; gap: 22px; }
  .light { background: var(--bg-cream); }
  .dark  { background: var(--bg-ink); }
  .light img.word, .dark img.word { height: 48px; }
  .mark { height: 64px; }
</style></head>
<body>
  <div class="light">
    <img class="word" src="../assets/marlo-logo.svg" alt="marlo"/>
    <img class="mark" src="../assets/marlo-mark.svg" alt="marlo mark"/>
  </div>
  <div class="dark">
    <img class="word" src="../assets/marlo-logo-on-dark.svg" alt="marlo"/>
    <img class="mark" src="../assets/marlo-mark.svg" alt="marlo mark"/>
  </div>
</body></html>
