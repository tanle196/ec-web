<!doctype html>
<html lang="en"><head>

<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; background: var(--bg-cream); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .icn { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icn svg { color: var(--ink-1); }
  .icn .lbl { font: 500 11px var(--font-mono); color: var(--ink-3); }
  .item { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 76px; }
</style></head>
<body>
