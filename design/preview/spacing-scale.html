<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; background: var(--bg-cream); }
  .row { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 6px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--persimmon); border-radius: 2px; }
  .name { font: 600 11px/1 var(--font-mono); color: var(--ink-2); }
  .px { font: 500 11px/1 var(--font-mono); color: var(--ink-3); }
  .lead { font: 500 11px/1 var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px; }
</style></head>
<body>
  <div class="lead">Spacing scale · 4px base</div>
  <div class="row">
    <div class="col"><div class="bar" style="width:4px;height:4px;"></div><span class="name">s-1</span><span class="px">4</span></div>
    <div class="col"><div class="bar" style="width:8px;height:8px;"></div><span class="name">s-2</span><span class="px">8</span></div>
    <div class="col"><div class="bar" style="width:12px;height:12px;"></div><span class="name">s-3</span><span class="px">12</span></div>
    <div class="col"><div class="bar" style="width:16px;height:16px;"></div><span class="name">s-4</span><span class="px">16</span></div>
    <div class="col"><div class="bar" style="width:20px;height:20px;"></div><span class="name">s-5</span><span class="px">20</span></div>
    <div class="col"><div class="bar" style="width:24px;height:24px;"></div><span class="name">s-6</span><span class="px">24</span></div>
    <div class="col"><div class="bar" style="width:32px;height:32px;"></div><span class="name">s-8</span><span class="px">32</span></div>
    <div class="col"><div class="bar" style="width:40px;height:40px;"></div><span class="name">s-10</span><span class="px">40</span></div>
    <div class="col"><div class="bar" style="width:56px;height:56px;"></div><span class="name">s-14</span><span class="px">56</span></div>
    <div class="col"><div class="bar" style="width:72px;height:72px;"></div><span class="name">s-18</span><span class="px">72</span></div>
  </div>
</body></html>
