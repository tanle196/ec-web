<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; background: var(--bg-cream); display: flex; gap: 18px; }
  .card { width: 220px; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 8px 8px 14px; position: relative; transition: all 150ms cubic-bezier(.2,.8,.2,1); }
  .card.hover { box-shadow: var(--shadow-sm); transform: translateY(-2px); }
  .img { width: 100%; aspect-ratio: 1; background: var(--bg-cream); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .img img { width: 100%; height: 100%; object-fit: contain; }
  .meta { padding: 12px 6px 0; display: flex; flex-direction: column; gap: 4px; }
  .seller { font: 500 11px/1 var(--font-sans); color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
  .name { font: 600 14px/1.2 var(--font-sans); color: var(--ink-1); }
  .price-row { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
  .price { font: 500 18px/1 var(--font-mono); color: var(--ink-1); }
  .strike { font: 500 13px/1 var(--font-mono); color: var(--ink-3); text-decoration: line-through; }
  .row2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .chip { font: 600 11px/1 var(--font-mono); background: #FFE7DD; color: #C73A12; padding: 4px 8px; border-radius: 999px; }
  .rating { font: 500 12px/1 var(--font-sans); color: var(--ink-2); }
  .heart { position: absolute; top: 16px; right: 16px; background: rgba(246,241,232,0.9); border: 0; width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .badge { position: absolute; top: 16px; left: 16px; background: #141210; color: white; font: 600 10px/1 var(--font-sans); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; }
</style></head>
<body>
  <div class="card">
    <span class="badge">New</span>
    <button class="heart"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141210" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button>
    <div class="img"><img src="../assets/placeholders/phone-orange.svg" alt=""/></div>
    <div class="meta">
      <span class="seller">Bayside Mobile</span>
      <span class="name">Halo Pro 14 — 128 GB, Persimmon</span>
      <div class="price-row"><span class="price">$649</span><span class="strike">$799</span></div>
      <div class="row2"><span class="chip">−19%</span><span class="rating">4.6 ★ · 2.3k</span></div>
    </div>
  </div>
  <div class="card hover">
    <div class="img"><img src="../assets/placeholders/headphones.svg" alt=""/></div>
    <div class="meta">
      <span class="seller">Northstar Audio</span>
      <span class="name">Overhead 3 wireless — Onyx</span>
      <div class="price-row"><span class="price">$229</span></div>
      <div class="row2"><span class="rating">4.8 ★ · 14k</span></div>
    </div>
  </div>
</body></html>
