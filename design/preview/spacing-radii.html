<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; background: var(--bg-cream); }
  .row { display: flex; gap: 22px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .box { width: 80px; height: 80px; background: white; border: 1px solid var(--border); }
  .name { font: 600 12px/1 var(--font-mono); color: var(--ink-2); }
  .px { font: 500 11px/1 var(--font-mono); color: var(--ink-3); }
  .note { font: 500 10px/1 var(--font-sans); color: var(--ink-3); margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:4px;"></div><span class="name">r-1</span><span class="px">4</span><span class="note">small chips</span></div>
    <div class="col"><div class="box" style="border-radius:8px;"></div><span class="name">r-2</span><span class="px">8</span><span class="note">buttons · inputs</span></div>
    <div class="col"><div class="box" style="border-radius:12px;"></div><span class="name">r-3</span><span class="px">12</span><span class="note">cards</span></div>
    <div class="col"><div class="box" style="border-radius:16px;"></div><span class="name">r-4</span><span class="px">16</span><span class="note">modals</span></div>
    <div class="col"><div class="box" style="border-radius:24px;"></div><span class="name">r-6</span><span class="px">24</span><span class="note">category tiles</span></div>
    <div class="col"><div class="box" style="border-radius:999px; background:var(--persimmon); border-color:transparent;"></div><span class="name">r-full</span><span class="px">999</span><span class="note">pills · chips</span></div>
  </div>
</body></html>
