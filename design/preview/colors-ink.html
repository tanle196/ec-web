<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; background: var(--bg-cream); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 88px; border-radius: var(--r-3); border: 1px solid transparent; }
  .name { font: 600 13px/1.1 var(--font-sans); color: var(--ink-1); }
  .hex { font: 500 11px/1 var(--font-mono); color: var(--ink-3); letter-spacing: .04em; }
</style></head>
<body>
  <div class="grid">
    <div class="swatch"><div class="chip" style="background:#141210;"></div><span class="name">Ink 1</span><span class="hex">#141210 · primary</span></div>
    <div class="swatch"><div class="chip" style="background:#5C5853;"></div><span class="name">Ink 2</span><span class="hex">#5C5853 · secondary</span></div>
    <div class="swatch"><div class="chip" style="background:#8A857E;"></div><span class="name">Ink 3</span><span class="hex">#8A857E · tertiary</span></div>
    <div class="swatch"><div class="chip" style="background:#B5AFA5;"></div><span class="name">Ink 4</span><span class="hex">#B5AFA5 · disabled</span></div>
  </div>
</body></html>
