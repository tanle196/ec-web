<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; background: var(--bg-cream); }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .swatch { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .chip { height: 96px; border-radius: var(--r-3); }
  .name { font: 600 13px/1.1 var(--font-sans); color: var(--ink-1); }
  .hex { font: 500 11px/1 var(--font-mono); color: var(--ink-3); letter-spacing: .04em; }
  .hero { flex: 2; }
  .hero .chip { background: #FF5B2E; display: flex; align-items: flex-end; padding: 16px; color: white; }
  .hero .chip span { font: 600 24px var(--font-display); letter-spacing: -1px; }
</style></head>
<body>
  <div class="row">
    <div class="swatch hero"><div class="chip" style="background:#FF5B2E;"><span>Persimmon — the brand color</span></div></div>
    <div class="swatch"><div class="chip" style="background:#E84A1E;"></div><span class="name">Hover</span><span class="hex">#E84A1E</span></div>
    <div class="swatch"><div class="chip" style="background:#C73A12;"></div><span class="name">Press</span><span class="hex">#C73A12</span></div>
    <div class="swatch"><div class="chip" style="background:#FFE7DD; border:1px solid var(--border);"></div><span class="name">Soft</span><span class="hex">#FFE7DD</span></div>
  </div>
</body></html>
