<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px 28px; background: var(--bg-cream); }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 6px; }
  .row .label { font: 500 11px/1 var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); width: 64px; flex: none; }
  .row .spec { font: 500 11px/1 var(--font-sans); color: var(--ink-3); margin-left: auto; }
  .specimen { font-family: var(--font-display); color: var(--ink-1); letter-spacing: -0.02em; line-height: 1; font-weight: 600; }
</style></head>
<body>
  <div class="row">
    <span class="label">Display</span>
    <span class="specimen" style="font-size: 56px;">Phone day.</span>
    <span class="spec">Bricolage 56 / 600</span>
  </div>
  <div class="row">
    <span class="label">H1</span>
    <span class="specimen" style="font-size: 40px;">New arrivals, weekly.</span>
    <span class="spec">Bricolage 40 / 600</span>
  </div>
  <div class="row">
    <span class="label">H2</span>
    <span class="specimen" style="font-size: 28px;">Trending in electronics</span>
    <span class="spec">Bricolage 28 / 600</span>
  </div>
</body></html>
