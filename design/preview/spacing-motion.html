<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; background: var(--bg-cream); }
  .row { display: flex; flex-direction: column; gap: 14px; }
  .item { display: flex; align-items: center; gap: 16px; }
  .label { width: 96px; font: 600 12px/1 var(--font-mono); color: var(--ink-1); flex: none; }
  .track { flex: 1; height: 28px; background: white; border-radius: 999px; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .ball { position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 999px; background: var(--persimmon); animation-duration: 1.6s; animation-iteration-count: infinite; animation-direction: alternate; }
  .e-out  { animation-name: e-out;  animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1); }
  .e-io   { animation-name: e-out;  animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  .e-lin  { animation-name: e-out;  animation-timing-function: linear; }
  @keyframes e-out { from { left: 4px; } to { left: calc(100% - 24px); } }
  .meta { font: 500 11px/1 var(--font-mono); color: var(--ink-3); width: 220px; flex: none; }
</style></head>
<body>
  <div class="row">
    <div class="item"><span class="label">ease-out</span><div class="track"><div class="ball e-out"></div></div><span class="meta">cubic-bezier(.2,.8,.2,1) · 150ms</span></div>
    <div class="item"><span class="label">ease-in-out</span><div class="track"><div class="ball e-io"></div></div><span class="meta">cubic-bezier(.4,0,.2,1) · 220ms</span></div>
    <div class="item"><span class="label">linear</span><div class="track"><div class="ball e-lin"></div></div><span class="meta">avoided · used for skeletons</span></div>
  </div>
</body></html>
