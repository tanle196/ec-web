<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; background: var(--bg-cream); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 64px; border-radius: var(--r-3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font: 600 13px var(--font-sans); }
  .name { font: 600 13px/1.1 var(--font-sans); color: var(--ink-1); }
  .hex { font: 500 11px/1 var(--font-mono); color: var(--ink-3); letter-spacing: .04em; }
</style></head>
<body>
  <div class="grid">
    <div class="swatch"><div class="chip" style="background:#FFE7DD; color:#C73A12;">−23%</div><span class="name">Persimmon soft</span><span class="hex">#FFE7DD</span></div>
    <div class="swatch"><div class="chip" style="background:#FBE5E8; color:#A91C30;">Sale</div><span class="name">Sale soft</span><span class="hex">#FBE5E8</span></div>
    <div class="swatch"><div class="chip" style="background:#E0F2EA; color:#15643F;">In stock</div><span class="name">Success soft</span><span class="hex">#E0F2EA</span></div>
    <div class="swatch"><div class="chip" style="background:#E0EBFB; color:#1F4FA0;">Prime</div><span class="name">Info soft</span><span class="hex">#E0EBFB</span></div>
    <div class="swatch"><div class="chip" style="background:#FCF1D9; color:#7A5510;">Low</div><span class="name">Warning soft</span><span class="hex">#FCF1D9</span></div>
  </div>
</body></html>
